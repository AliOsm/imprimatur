[package]
name = "imprimatur"
version = "0.5.0"
description = "XLSX, PDF and DOCX authoring, and PDF, XLSX, XLS, ODS and DOCX reading, with its own XML, zip and PDF code."
keywords = ["xlsx", "excel", "pdf", "docx", "spreadsheet"]
categories = ["encoding", "text-processing"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = [
  "src/**/*.rs",
  "src/**/*.txt",
  "README.md",
  "LICENSE*",
  # Tests and their fixtures build nothing a published crate needs.
  "!src/**/tests.rs",
  "!src/**/tests/**",
  "!src/**/test_support.rs",
]

[lints]
workspace = true

[dependencies]
aes = "0.9.3"
crc32fast = "1.5.2"
datamatrix = "0.3.3"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
qrcode = { version = "0.14.1", default-features = false }
read-fonts = { version = "0.45.1", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[features]
# `read::json`: content and images as JSON, the schema the command line and
# the Ruby binding share.
json = ["dep:serde_json"]
# `archive`: zip archives of any files (written with their times and
# comments, ZIP64 when large; read within limits), through the `zip` crate.
archive = ["dep:zip"]
# `font`: static TrueType font data (glyphs, advances, line metrics),
# through `read-fonts`.
fonts = ["dep:read-fonts"]

[dev-dependencies]
font-test-data = "0.10.0"
tempfile.workspace = true
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
